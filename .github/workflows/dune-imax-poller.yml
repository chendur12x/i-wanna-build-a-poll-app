name: Dune 3 IMAX Rows A-G Radar Poller

on:
  schedule:
    # Watchdog cron fallback: ensures loop stays alive if ever interrupted
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      test_alert:
        description: 'Send test alert for Rows A-G'
        required: false
        type: boolean
        default: false
      movie_keyword:
        description: 'Target movie keyword (e.g. dune)'
        required: false
        type: string
        default: 'dune'

permissions:
  actions: write
  contents: read

concurrency:
  group: dune-imax-poller
  cancel-in-progress: false

jobs:
  poll-tickets:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore Deduplication State Cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: radar-state-${{ github.run_id }}
          restore-keys: |
            radar-state-

      - name: Execute Guaranteed 5-Min Rows A-G Radar Loop
        env:
          MOVIE_KEYWORD: ${{ inputs.movie_keyword || secrets.MOVIE_KEYWORD || 'dune' }}
          CITY: ${{ secrets.CITY || 'chennai' }}
          FORMAT_REQUIRED: ${{ secrets.FORMAT_REQUIRED || 'IMAX' }}
          POLL_INTERVAL_SECONDS: '300'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'chendur12-dune-radar' }}
          SEND_HEARTBEAT: 'true'
          BMS_COOKIE: ${{ secrets.BMS_COOKIE }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          TO_PHONE_NUMBER: ${{ secrets.TO_PHONE_NUMBER }}
          CALLMEBOT_TELEGRAM_USER: ${{ secrets.CALLMEBOT_TELEGRAM_USER || 'chendur12' }}
        run: |
          mkdir -p .cache
          if [ "${{ inputs.test_alert }}" = "true" ]; then
            echo "[Workflow] Running simulated Rows A-G test alert..."
            node poller.js --test-alert
          fi
          echo "[Workflow] Starting guaranteed 5-minute polling loop (300 minutes / 60 sweeps)..."
          node poller.js --loop-minutes=300

      - name: Chain Next 5-Hour Polling Cycle (Zero-Gap Continuity)
        if: always()
        run: |
          echo "[Workflow] Triggering next 5-hour polling cycle via workflow_dispatch..."
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/dune-imax-poller.yml/dispatches" \
            -d '{"ref":"main"}' || true
